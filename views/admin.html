<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SmartRestaurant Admin</title>
<style>
  :root {
    --bg: #f4f1ec; --surface: #fff; --ink: #1e1b18; --soft: #6b645c; --line: #e3ded6;
    --brand: #e8590c; --brand-dark: #c2410c; --brand-soft: #ffe8d9;
    --ok: #2b8a3e; --ok-soft: #dff3e3; --bad: #c92a2a; --bad-soft: #fbe3e3;
    --info: #1c7ed6; --info-soft: #e3f0fc; --warn: #e67700; --warn-soft: #fff1d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff;
           padding: 18px 16px 22px; border-radius: 0 0 24px 24px; }
  .bar { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-size: 20px; margin: 0; flex: 1; }
  .bar small { display: block; opacity: .85; font-weight: 400; font-size: 13px; }
  .stats { max-width: 960px; margin: 14px auto 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,.18); border-radius: 14px; padding: 8px 14px; min-width: 96px; }
  .stat b { display: block; font-size: 24px; line-height: 1.1; }
  .stat span { font-size: 12px; opacity: .9; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft);
       margin: 24px 0 8px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
          padding: 4px 16px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 0; flex-wrap: wrap;
         border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 140px; }
  .name { font-weight: 650; }
  .sub { color: var(--soft); font-size: 13px; }
  .empty { padding: 18px 0; color: var(--soft); text-align: center; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px;
           font-weight: 700; margin-right: 4px; }
  .b-ok { background: var(--ok-soft); color: var(--ok); }
  .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-info { background: var(--info-soft); color: var(--info); }
  .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-grey { background: #eee9e1; color: var(--soft); }
  button, select, input { font: inherit; }
  button { border: 0; border-radius: 12px; padding: 9px 16px; font-weight: 650; cursor: pointer;
           background: var(--brand); color: #fff; }
  button:hover { background: var(--brand-dark); }
  button.ok { background: var(--ok); } button.ok:hover { background: #1f6b2f; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button.ghost:hover { background: var(--brand-soft); }
  button.danger { background: var(--bad-soft); color: var(--bad); }
  button.danger:hover { background: #f5c6c6; }
  button:disabled { opacity: .5; cursor: default; }
  select, input[type=password] { padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line);
                                 background: #faf8f5; }
  .alert { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .alert-bad { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .log { font-size: 13px; color: var(--soft); padding: 10px 0; }
  .log div { padding: 2px 0; }
  #login { max-width: 360px; margin: 14vh auto; padding: 0 16px; }
  #login .card { padding: 22px; }
  #login h1 { margin: 0 0 4px; font-size: 22px; }
  #login input { width: 100%; margin: 14px 0 10px; }
  #login button { width: 100%; }
  #loginError { color: var(--bad); min-height: 20px; font-size: 13px; }
  #conn { font-size: 12px; opacity: .9; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>SmartRestaurant</h1>
    <div class="sub">Admin panel</div>
    <form id="loginForm">
      <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" autofocus>
      <div id="loginError"></div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <h1>SmartRestaurant <small>Admin panel <span id="conn"></span></small></h1>
      <button class="ghost" id="logout">Sign out</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="sPending">0</b><span>join requests</span></div>
      <div class="stat"><b id="sOnline">0</b><span>waiters online</span></div>
      <div class="stat"><b id="sTables">0</b><span>tables busy</span></div>
      <div class="stat"><b id="sEsc">0</b><span>escalated</span></div>
    </div>
  </header>

  <main>
    <h2>Join requests</h2>
    <div class="card" id="joinBox"></div>

    <h2>Escalated requests</h2>
    <div class="card" id="escBox"></div>

    <h2>Waiters</h2>
    <div class="card" id="waiterBox"></div>

    <h2>Tables</h2>
    <div class="card" id="tableBox"></div>

    <h2>Recent requests</h2>
    <div class="card" id="reqBox"></div>

    <h2>Activity</h2>
    <div class="card"><div class="log" id="logBox"></div></div>
  </main>
</div>

<script src="/admin.js"></script>
</body>
</html>
